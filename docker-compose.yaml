# mcpgate — Zero-Config Setup
#
# Just run: docker compose up -d
# Then open: http://localhost:8642
#
# The setup wizard guides you through everything.
# Secrets are auto-generated on first start.
# Configuration is persisted in the gateway-data volume.
#
# For advanced configuration, create a .env file (see .env.example).

services:
  mcpgate:
    image: mcpgate/mcpgate:latest
    ports:
      - "8642:3001"
    env_file:
      - path: .env
        required: false
    environment:
      - BASE_URL=http://localhost:8642
      - REDIS_URL=redis://:${REDIS_PASSWORD:-mcpgate-default-pw}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      # Persistent data — auto-generated secrets, wizard config, extensions
      - gateway-data:/app/data

  # Redis holds authentication state (OAuth tokens, sessions, magic-link
  # JTIs, OIDC user records) next to the request cache.
  #   * noeviction — when memory is full, Redis refuses new writes instead of
  #     evicting keys. An eviction policy would silently drop live OAuth
  #     tokens and sessions. Raise --maxmemory if you hit the limit.
  #   * appendonly — on restart Redis replays the AOF, so recently issued
  #     tokens and sessions survive and users do not have to sign in again.
  redis:
    image: redis:8-alpine
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:-mcpgate-default-pw}
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --save 60 1
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mcpgate-default-pw}", "ping"]
      interval: 5s
      retries: 3
    restart: unless-stopped

volumes:
  gateway-data:
  redis-data:
